services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: seovy_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=seovy
      - DB_USERNAME=seovy_user
      - DB_PASSWORD=seovy_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - postgres
      - redis
    networks:
      - seovy_net

  nginx:
    image: nginx:1.27-alpine
    container_name: seovy_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - seovy_net

  postgres:
    image: postgres:16-alpine
    container_name: seovy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seovy
      POSTGRES_USER: seovy_user
      POSTGRES_PASSWORD: seovy_secret
    ports:
      - "5433:5432"
    volumes:
      - seovy_postgres_data:/var/lib/postgresql/data
    networks:
      - seovy_net

  redis:
    image: redis:7-alpine
    container_name: seovy_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - seovy_redis_data:/data
    networks:
      - seovy_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: seovy_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=300
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - seovy_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: seovy_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - seovy_net

volumes:
  seovy_postgres_data:
  seovy_redis_data:

networks:
  seovy_net:
    driver: bridge
